name: Verify ClearLedger
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: clearledger_ci
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clearledger_ci -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://clearledger_ci:ephemeral-ci-only@127.0.0.1:5432/postgres
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache-clean
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependency manager
        run: python -m pip install uv==0.13.5
      - name: Install locked environment
        run: uv sync --frozen
      - name: Complete verification with disposable PostgreSQL databases
        run: uv run --frozen python scripts/verify.py
      - name: Preserve detailed check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: local-data/verification/*.log
