[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "clearledger"
version = "0.1.0"
description = "Local INR cash application workstation — foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "hypothesis>=6.120,<7", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires PostgreSQL and creates a disposable database"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache*", ".local-runtime", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

