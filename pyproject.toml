[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "clearledger"
version = "0.1.0"
description = "Local INR cash application workstation — foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=6.21.2,<7",
  "google-genai>=2.33,<3",
  "langgraph>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "hypothesis>=6.120,<7", "ruff>=0.9,<1", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires PostgreSQL and creates a disposable database"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache*", ".local-runtime", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
  "src/clearledger/money.py", "src/clearledger/matching_domain.py",
  "src/clearledger/advanced_domain.py", "src/clearledger/document_contract.py",
  "src/clearledger/document_privacy.py", "src/clearledger/remittance_parser.py",
  "src/clearledger/extraction_provider.py", "src/clearledger/worker_security.py",
  "src/clearledger/provider_budget.py",
  "src/clearledger/case_domain.py", "src/clearledger/case_schemas.py",
  "src/clearledger/evidence_contract.py", "src/clearledger/evidence_domain.py",
  "src/clearledger/evidence_runtime.py",
  "src/clearledger/investigation_contract.py", "src/clearledger/investigation_director.py",
  "src/clearledger/finance_contract.py", "src/clearledger/finance_domain.py",
  "src/clearledger/finance_identity.py",
  "src/clearledger/review_contract.py", "src/clearledger/review_password.py",
  "src/clearledger/correlation_contract.py",
]

