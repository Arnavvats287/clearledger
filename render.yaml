services:
  - type: web
    name: clearledger-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: off
    buildCommand: python -m pip install uv==0.13.5 && uv sync --frozen
    startCommand: uv run --frozen python scripts/serve_portfolio.py
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DATABASE_URL
        sync: false
      - key: PORTFOLIO_MIGRATION_DATABASE_URL
        sync: false
      - key: PORTFOLIO_ORIGIN
        sync: false
  - type: web
    name: clearledger
    runtime: static
    branch: main
    rootDir: frontend
    autoDeployTrigger: off
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 24.22.0
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
